apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarai-backend
  namespace: sarai
  labels:
    app: sarai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sarai-backend
  template:
    metadata:
      labels:
        app: sarai-backend
    spec:
      containers:
        - name: backend
          image: sarai/backend:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: sarai-config
            - secretRef:
                name: sarai-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sarai-backend-hpa
  namespace: sarai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sarai-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
