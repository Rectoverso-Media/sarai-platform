# ⚠️ Template — Ganti semua <BASE64_ENCODED_VALUE> dengan secret yang sebenarnya
# Encode: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: sarai-secrets
  namespace: sarai
type: Opaque
data:
  DATABASE_URL: <BASE64_ENCODED_VALUE>
  JWT_SECRET: <BASE64_ENCODED_VALUE>
  JWT_REFRESH_SECRET: <BASE64_ENCODED_VALUE>
  GOOGLE_CLIENT_ID: <BASE64_ENCODED_VALUE>
  GOOGLE_CLIENT_SECRET: <BASE64_ENCODED_VALUE>
  STRIPE_SECRET_KEY: <BASE64_ENCODED_VALUE>
  STRIPE_WEBHOOK_SECRET: <BASE64_ENCODED_VALUE>
  AIRBYTE_API_URL: <BASE64_ENCODED_VALUE>
  AIRBYTE_API_TOKEN: <BASE64_ENCODED_VALUE>
  GROQ_API_KEY: <BASE64_ENCODED_VALUE>
  POSTGRES_PASSWORD: <BASE64_ENCODED_VALUE>
