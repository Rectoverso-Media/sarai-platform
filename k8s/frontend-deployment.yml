apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarai-frontend
  namespace: sarai
  labels:
    app: sarai-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sarai-frontend
  template:
    metadata:
      labels:
        app: sarai-frontend
    spec:
      containers:
        - name: frontend
          image: sarai/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service:3001"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
