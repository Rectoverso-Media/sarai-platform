name: SARAI — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Backend — Lint, Type Check, Unit Tests
  # ──────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sarai_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔷 Type check (TypeScript)
        run: npx tsc --noEmit

      - name: 🔍 Lint
        run: npm run lint

      - name: 🗄️ Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/sarai_test_db

      - name: 🧪 Run unit tests with coverage
        run: npm run test:cov -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/sarai_test_db
          JWT_SECRET: test-jwt-secret-for-ci-only-not-production
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_dummy_for_ci
          GROQ_API_KEY: dummy_groq_key_for_ci

      - name: 📊 Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

      - name: 🏗️ Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/sarai_test_db

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Frontend — Type Check, Lint, Build
  # ──────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔷 Type check (TypeScript)
        run: npx tsc --noEmit

      - name: 🏗️ Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NODE_ENV: production

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Security Audit
  # ──────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔒 Audit backend dependencies (high severity)
        run: npm audit --audit-level=high --omit=dev
        working-directory: ./backend
        continue-on-error: true  # Non-blocking untuk sekarang, ubah ke false setelah fix vulns

      - name: 🔒 Audit frontend dependencies (high severity)
        run: npm audit --audit-level=high --omit=dev
        working-directory: ./frontend
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # JOB 4: Docker Build Test
  # ──────────────────────────────────────────────────────────────
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build backend Docker image
        run: |
          docker build \
            --target production \
            --tag sarai-backend:ci-test \
            ./backend

      - name: 🐳 Build frontend Docker image
        run: |
          docker build \
            --build-arg DOCKER_BUILD=true \
            --target runner \
            --tag sarai-frontend:ci-test \
            ./frontend
